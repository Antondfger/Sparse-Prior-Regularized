cuda_visible_devices: 0
random_state: 17
defaults:
  - _self_
  - datasets_info: Zvuk

dataset_params:
  max_length: 128
  num_negatives: 

dataloader:
  batch_size: 64
  test_batch_size: 64
  num_workers: 8
  
model: SASRec
model_params:
  maxlen: ${dataset_params.max_length}
  hidden_units: 224
  num_blocks: 1
  num_heads: 4
  dropout_rate: 0.4
  
seqrec_module:
  type_adj: 
  lr: 0.001
  predict_top_k: 10  # this value is used for validation
  filter_seen: False

adj: 

counts: False

type_loss: entmax # possible ce/sparsemax/entmax
temp: 26

trainer_params:
  max_epochs: 100
patience: 10
top_k_metrics: [10, 100]

project_name: entmax/test
task_name: 'experiments'