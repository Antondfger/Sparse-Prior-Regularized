cuda_visible_devices: 0
random_state: 17
defaults:
  - _self_
  - datasets_info: Tmall

dataset_params:
  max_length: 128
  num_negatives: 
  gamma: 0
  filter_seen_sampling: True

dataloader:
  batch_size: 64
  test_batch_size: 64
  num_workers: 8
  
model: GRU4Rec
model_params:
  input_size: 128
  hidden_size: ${model_params.input_size}
  num_layers: 2
  dropout: 0.3
  
seqrec_module:
  type_adj: 
  lr: 0.001
  predict_top_k: 10  # this value is used for validation
  filter_seen: False

adj: 

counts: False

type_loss: entmax # possible ce/sparsemax/entmax
temp: 1

trainer_params:
  max_epochs: 100
patience: 10
top_k_metrics: [10, 100]

project_name: entmax
task_name: 'experiments'