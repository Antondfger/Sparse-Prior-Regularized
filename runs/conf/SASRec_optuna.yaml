defaults:
  - _self_
  - datasets_info: Zvuk
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: tpe

temp: 1
type_loss: entmax #ce
counts: False

adj: 

hydra:
  sweeper:
    direction: maximize
    study_name: ${datasets_info.name}
    storage: 'sqlite:///SasRec-${datasets_info.name}-${type_loss}.db'
    n_trials: 50
    n_jobs: 1
    params:
      model_params.hidden_units: range(64, 256, step=32)
      model_params.num_blocks: range(1, 3)
      model_params.num_heads: choice(1, 2, 4)
      model_params.dropout_rate: range(0.1, 0.5, 0.1)
      temp: tag(log, interval(0.001, 100))

random_state: 17
cuda_visible_devices: 1

optimization_metric: NDCG@10

dataset_params:
  max_length: 64
  num_negatives: 50000

dataloader:
  batch_size: 64
  test_batch_size: 64
  num_workers: 8
 
model: SASRec
model_params:
  maxlen: ${dataset_params.max_length}
  hidden_units: 160
  num_blocks: 1
  num_heads: 4
  dropout_rate: 0.4
  
seqrec_module:
  lr: 0.001
  predict_top_k: 10  # this value is used for validation
  filter_seen: False

trainer_params:
  max_epochs: 100
patience: 10
top_k_metrics: [10, 100]

project_name: entmax/hyper/${datasets_info.name}_${type_loss}
task_name: 'experiments'